<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triage dashboard - SpellBreak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="triage" data-crumb="Reported cases" data-crumb-parent="OCBC staff" data-shell="staff">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <div class="triage-head">
          <div class="page-head" style="margin-bottom:0">
            <h1>Reported cases</h1>
            <p>Sorted by risk level and amount at stake. Review the evidence before you release or block anything.</p>
          </div>
          <label class="search">
            <span class="sr-only">Search cases</span>
            <span data-icon="search"></span>
            <input class="input" id="caseSearch" type="search" placeholder="Search case, customer or scam type" />
          </label>
        </div>

        <div class="kpis">
          <div class="kpi"><span>Open cases</span><strong class="num" id="kpiOpen">-</strong></div>
          <div class="kpi alert"><span>High risk (open)</span><strong class="num" id="kpiHigh">-</strong></div>
          <div class="kpi"><span>Amount at stake</span><strong class="num" id="kpiAmount">-</strong></div>
          <div class="kpi"><span>Median time to triage</span><strong class="num" id="kpiTriage">-</strong></div>
        </div>
        <p class="hint" style="margin:-6px 0 18px" id="kpiHint">Loading cases...</p>

        <div class="triage-layout">
          <section class="panel table-panel" aria-labelledby="tableTitle">
            <h2 class="sr-only" id="tableTitle">Cases</h2>
            <div class="segmented" role="tablist" aria-label="Filter by risk" id="riskFilter">
              <button type="button" role="tab" aria-selected="true" data-risk="all">All</button>
              <button type="button" role="tab" aria-selected="false" data-risk="high">High</button>
              <button type="button" role="tab" aria-selected="false" data-risk="med">Medium</button>
              <button type="button" role="tab" aria-selected="false" data-risk="low">Low</button>
            </div>
            <div class="table-wrap">
              <table class="cases">
                <thead><tr><th scope="col">Case</th><th scope="col">Scam type</th><th scope="col">Risk</th><th scope="col" class="right">Amount</th><th scope="col">Status</th></tr></thead>
                <tbody id="caseRows"></tbody>
              </table>
            </div>
          </section>

          <section class="panel case-detail" aria-live="polite" id="caseDetail"></section>
        </div>
      </main>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/app.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/triage.js"></script>
</body>
</html>
