<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d2101e" />
  <title>Mobile banking demo - SpellBreak extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <div class="stage">
    <!-- Desktop only: jump to any flow during a demo -->
    <aside class="rail" aria-label="Demo scenarios">
      <div class="rail-brand"><span class="ollie" id="railOllie"></span><span><strong>SpellBreak extension</strong><span>Mobile banking demo, port 4000</span></span></span></div>
      <p class="rail-intro">A simulated banking app with the SpellBreak extension inside it. Synthetic data only.</p>
      <nav class="rail-nav" id="railNav"></nav>
      <div class="rail-foot">
        <button type="button" class="rail-btn" id="resetDemo">Reset demo</button>
        <a class="rail-link" href="http://localhost:3000">Open the SpellBreak platform (port 3000)</a>
      </div>
    </aside>

    <div class="device">
      <div class="screen" id="screen">
        <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="status-icons"><i></i><i></i><i></i></span></div>
        <header class="appbar" id="appbar"></header>
        <main class="view" id="view" tabindex="-1"></main>
        <nav class="tabbar" id="tabbar" aria-label="App">
          <button type="button" data-go="home" data-tab="home"><span data-icon="home"></span>Home</button>
          <button type="button" data-go="transfer" data-tab="pay"><span data-icon="send"></span>Pay</button>
          <button type="button" data-tab="cards" data-soon><span data-icon="card"></span>Cards</button>
          <button type="button" data-tab="invest" data-soon><span data-icon="chart"></span>Invest</button>
          <button type="button" data-go="more" data-tab="more"><span data-icon="menu"></span>More</button>
        </nav>
        <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
        <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="js/mobile.js"></script>
</body>
</html>
