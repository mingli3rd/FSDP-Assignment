<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpellBreak</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">SpellBreak</a>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero">
        <h1>Spot the fake before it costs you.</h1>
        <p>
          SpellBreak helps you recognise, verify and respond to AI voice-clone
          and deepfake scams before any money is lost.
        </p>
      </section>

      <section class="card">
        <h2>System check</h2>
        <div class="status-row">
          <span class="status-dot" id="healthDot"></span>
          <span id="healthText">Checking...</span>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    SpellBreak prototype · Synthetic data only
  </footer>

  <script src="js/main.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
