<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - SpellBreak</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">SpellBreak</a>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="card auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to continue.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Log in</button>

          <p id="message" class="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="switch-line">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    SpellBreak prototype · Synthetic data only
  </footer>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
